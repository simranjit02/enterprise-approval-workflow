<!DOCTYPE html>
<!-- Local sign-in for mocked users (cds watch). Deployed apps use the XSUAA login page instead. -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · Enterprise Approval Workflow</title>
    <style>
        :root { --brand: #0a6ed1; --error: #bb0000; --text: #1d2d3e; --muted: #556b82; --bg: #f5f6f7; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg);
               font-family: "72", "72full", Arial, Helvetica, sans-serif; color: var(--text); padding: 0 16px; }
        form { width: 100%; max-width: 22rem; background: #fff; padding: 2rem; border-radius: 0.75rem;
               box-shadow: 0 0.25rem 1rem rgba(0, 0, 0, 0.08); box-sizing: border-box; }
        h1 { font-size: 1.25rem; margin: 0 0 0.25rem; }
        p { margin: 0 0 1.5rem; color: var(--muted); font-size: 0.875rem; }
        label { display: block; font-size: 0.875rem; margin-bottom: 0.25rem; }
        input { width: 100%; box-sizing: border-box; padding: 0.625rem; margin-bottom: 1rem; font: inherit;
                border: 1px solid #89919a; border-radius: 0.25rem; }
        input:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
        button { width: 100%; padding: 0.625rem; font: inherit; font-weight: bold; color: #fff;
                 background: var(--brand); border: 0; border-radius: 0.5rem; cursor: pointer; }
        button:disabled { opacity: 0.6; cursor: default; }
        #error { color: var(--error); font-size: 0.875rem; margin: 0 0 1rem; }
        h2 { font-size: 0.875rem; color: var(--muted); margin: 1.5rem 0 0.5rem; font-weight: normal; }
        #users { display: grid; gap: 0.5rem; }
        #users button { color: var(--text); background: var(--bg); font-weight: normal; text-align: left;
                        border: 1px solid #d9d9d9; display: flex; justify-content: space-between; gap: 0.5rem; }
        #users button:hover { border-color: var(--brand); }
        #users span { color: var(--muted); font-size: 0.8125rem; }
    </style>
</head>
<body>
    <form id="login" novalidate>
        <h1>Sign in</h1>
        <p>Enterprise Approval Workflow</p>
        <div id="error" role="alert" hidden></div>
        <label for="user">Email</label>
        <input id="user" name="user" type="email" autocomplete="username" required autofocus>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Sign in</button>

        <!-- Mock users from package.json (cds.requires.auth.users); local testing only. -->
        <h2>Test users: click to sign in</h2>
        <div id="users">
            <button type="button" data-user="test@company.com" data-password="test">test@company.com <span>All roles</span></button>
            <button type="button" data-user="requester@company.com" data-password="requester">requester@company.com <span>Requester</span></button>
            <button type="button" data-user="manager@company.com" data-password="manager">manager@company.com <span>Manager</span></button>
            <button type="button" data-user="finance@company.com" data-password="finance">finance@company.com <span>Finance</span></button>
            <button type="button" data-user="noaccess@company.com" data-password="noaccess">noaccess@company.com <span>No access</span></button>
        </div>
    </form>
    <script>
        var form = document.getElementById("login");
        var error = document.getElementById("error");
        // Only same-site paths, so ?return= can't send people to another site.
        var target = new URLSearchParams(location.search).get("return");
        if (!target || target.charAt(0) !== "/" || target.charAt(1) === "/") {
            target = "/approval-ui/webapp/index.html";
        }

        document.getElementById("users").addEventListener("click", function (e) {
            var pick = e.target.closest("button");
            if (!pick) return;
            form.user.value = pick.dataset.user;
            form.password.value = pick.dataset.password;
            form.requestSubmit();
        });

        form.addEventListener("submit", function (e) {
            e.preventDefault();
            var button = form.querySelector("button[type=submit]");
            button.disabled = true;
            error.hidden = true;

            // A successful request with credentials makes the browser reuse them for the app's OData calls.
            var xhr = new XMLHttpRequest();
            xhr.open("GET", "/odata/v4/approval/", true, form.user.value.trim(), form.password.value);
            xhr.onloadend = function () {
                if (xhr.status === 200) {
                    location.href = target;
                    return;
                }
                error.textContent = xhr.status === 401 || xhr.status === 403
                    ? "Wrong email or password."
                    : "Sign-in failed. Is the server running?";
                error.hidden = false;
                button.disabled = false;
                form.password.focus();
            };
            xhr.send();
        });
    </script>
</body>
</html>
